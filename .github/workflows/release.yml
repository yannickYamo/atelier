name: Release

# Tag-triggered, so the artifact published is the one a tag names and not whatever happened to be in
# a laptop's working tree. The same checks CI runs must pass again here: a tag can be pushed from a
# commit CI never saw.
on:
  push:
    tags: ['v*']

permissions:
  # write: the job creates the GitHub release for the tag.
  contents: write
  # npm provenance. Worth having on a package by an unknown author that reads a private corpus and
  # holds a credential: it lets an installer verify the tarball was built from this commit, in this
  # workflow, rather than uploaded by hand.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # a step's `if` cannot read secrets directly, only the job's env
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The tag and the manifest must agree. A tag that does not match `version` publishes something
      # nobody can find again from the release.
      - name: the tag is the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1; }

      # The GitHub release is the release of record: notes are the tag's own CHANGELOG section.
      - name: release notes from the CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $V"; exit 1; }
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Atelier ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

      # npm only when a token is configured: without one the release stops at GitHub, on purpose,
      # rather than failing after the release above was made.
      - name: npm publish
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
