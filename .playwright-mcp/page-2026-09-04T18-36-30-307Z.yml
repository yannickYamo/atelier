        - heading "A" [level=3] [ref=e401]
        - paragraph [ref=e402]: I am starting to plan out the Thanksgiving menu already even though it is still three weeks away. My mom always does the turkey and the gravy, so I am in charge of the sides and one dessert. I want to do a green bean casserole but the from scratch version, not the one with the Campbell's cream of mushroom soup, although honestly the canned French's fried onions on top are non negotiable. I am also making mashed potatoes with a lot of butter and Kerrygold is the only butter I will use for this. My aunt is bringing her sweet potato casserole with the marshmallows and I am not a huge fan since it is basically a dessert, but everyone else loves it so I will not say anything. For my dessert I am torn between a pumpkin pie and an apple crisp. I think I prefer the apple crisp because I can do my stewed apple thing with cinnamon and less sugar, and I do not like when the pie filling is so sweet it makes you feel ill after. Actually, I take that back, I am going to make both because my brother will be very upset if there is no pumpkin pie. I am going to Trader Joe's on Saturday for most of it and then Whole Foods for the good cheese for the appetizer board. Hattie is coming this year since her family is in Oregon and it is too far to fly, and she said she would bring rolls and a bottle of wine. We are also doing a 5k Turkey Trot in the morning which I am excited about, my new Hokas came in finally after I left my old pair at the hotel. I want to make cranberry sauce from actual cranberries too, the kind that pops when you cook it down with orange zest. Fresh orange zest in anything is the best, the smell alone cannot be beaten.
      - generic [ref=e403]:
        - heading "B" [level=3] [ref=e404]
        - paragraph [ref=e405]: "**November 18 â€” evening, kitchen table**"
        - paragraph [ref=e406]: Fourteen people this year, which is four more than the table seats and six more than the oven can honestly serve at one temperature. Two of them don't eat meat, one is off dairy since August, and my aunt Dee (who has handled pies since before I could reach the counter) says she's driving in Thursday morning instead of Wednesday night. So the menu I sat down to draft tonight was never really a menu. It was a plan for absorbing pressure.
        - paragraph [ref=e407]: "One example: the green bean casserole. I put it on the list at 6:40 and took it off at 6:55 and put it back at 7:20, because it isn't food, it's a signal, and cutting it would say something to my mother that I don't want to say (she has made it thirty-one years running, including the year we ate in a rental with two working burners). Keeping a dish nobody eats is not inefficiency. It's continuity, memory, and belonging, and it costs one rack for forty minutes."
        - paragraph [ref=e408]: "This is where my mother and I run in opposite directions, and I've stopped pretending otherwise. She is going to answer a crowded table by cooking more â€” a second bird, a third starch, a \"just in case\" ham. I am going to answer it by cutting until every dish has a reason. On the phone tonight she says, \"you can't run out,\" and I say I'd rather run out than serve four things lukewarm. Neither of us moved. But the draft that came out of that call is better than either of us would have written alone: her instinct kept the cornbread dressing, mine killed the second potato. Having two people who plan differently turned out to be an asset rather than a cost."
        - paragraph [ref=e409]: What I keep landing on is that the meal has never held together because of the food. The years that went well weren't the years with the best turkey. They were the years everyone knew where they fit â€” Dee on pies, my brother on the driveway and the ice, me on timing â€” and nobody had to be told. That shared understanding did more for the day than any recipe, and it's the part I can't put on a list.
