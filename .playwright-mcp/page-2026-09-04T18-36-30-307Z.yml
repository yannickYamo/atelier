        - paragraph [ref=e283]: Right now I am planning the holiday cookie exchange for my apartment and I am way more excited than I probably should be. We are doing it the Saturday before finals week and I told everyone to bring three dozen so we all leave with a real amount and not just crumbs. I am making my brown butter chocolate chip with flaky salt on top, and I am going to test a batch this Thursday because the last time I made them I forgot to chill the dough and they spread into one giant sheet cookie. Maddie is bringing peppermint bark cookies and Sofia is doing a gingerbread with a cream cheese glaze which honestly might beat mine, although the fan favorite every year is the plain sugar cookie with the thick frosting. I think that one is overrated but I will still eat four of them. I need to go to Trader Joe's for the butter and the vanilla and probably the parchment paper since we are always out, and I want to grab those little bakery boxes so people can pack theirs up nicely. My best friend Hattie is coming down for the weekend so she will be there, she just finished her last final on Friday so the timing worked out perfectly. I am going to make a hot chocolate bar too with chocolate milk warmed on the stove and marshmallows and maybe cinnamon sticks, but I am not adding extra sugar because most holiday drinks are already so sweet I feel ill after. Actually, I take that back, I might do a little peppermint syrup on the side for whoever wants it. I love this time of year, everyone is stressed but nobody can be stressed while eating a warm cookie. The smell of the apartment alone cannot be beaten.
