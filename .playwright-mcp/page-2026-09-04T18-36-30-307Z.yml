        - heading "A" [level=3] [ref=e214]
        - paragraph [ref=e215]: "**January 12**"
        - paragraph [ref=e216]: "The alert came through at 9:40 last night: twelve to sixteen inches, and the district closing before the first flake landed. Two deadlines of mine moved with it, which meant the whole day had to be rebuilt by morning under conditions nobody in this house had chosen."
        - paragraph [ref=e217]: So I made a plan on the back of a grocery receipt. Sledding at ten, soup at one, the hard part of my work squeezed into the flat hours after. I like a plan on a snow day the way I like a plan anywhere â€” it converts an interruption into something I can be accountable to. Dana is going to handle a lost day in a different manner, which is to say she does not handle it at all; she lets it drift and trusts the drift. When I read her the receipt she said, without looking up, "you know the snow doesn't care about your one o'clock."
        - paragraph [ref=e218]: "One example of why she is usually right: last February, the same storm, the same receipt, and I spent the good light rushing Theo (eight, and slow with boots) through a schedule he had not agreed to. He cried at the top of the hill. I logged the day as a success because the soup happened on time."
        - paragraph [ref=e219]: So this morning I let the plan go soft. We get outside late. Mrs. Alvarez, the widow two doors down, is already shoveling her own walk, and Theo goes over and takes the second shovel without being asked to. That was the part I could not have scheduled. The morning develops on its own terms and I get maybe forty minutes of real work, which is forty more than I earned.
        - paragraph [ref=e220]: The thing that carried the day was not my planning and not Dana's patience but whatever sits underneath both â€” the shared sense in this house that a lost day belongs to all of us. Trust, warmth, and a kind of ordinary resilience got us to dinner. Having two different instincts about a snow day turns out to be an asset, not a problem to be settled.
        - paragraph [ref=e221]: Tomorrow the plows come. Today the receipt stayed in my pocket.
