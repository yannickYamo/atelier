        - paragraph [ref=e40]: I fly out Wednesday morning at 6:40 which means I have to leave for the airport around 4:15, so I am packing tonight instead of trying to do it half asleep. I have my carry on and one checked bag, and I already know I am going to go over the weight limit because I am bringing home laundry, which my mom says is fine but always makes a comment about. I packed my Lululemon Aligns, three sweatshirts, and my Uggs for the plane since it is going to be so cold at home. I accidentally packed my charger at the bottom of the checked bag so I had to unzip everything and start over. I am bringing home 30 cookies from the bakery near campus for my little brother because he asked, and I got him the birthday cake one and the Oreo Cookies n Cream, although honestly the honeycomb dark chocolate is better and nobody agrees with me. My roommate Hattie is driving me since her flight is not until Thursday night, which is so nice of her. I have my snacks ready for the plane, an RXBAR, an apple, and a Dannon Oikos Greek yogurt if they let me through with it, and I will get a Starbucks in the terminal but I always ask for no classic syrup because it is way too much added sugar and then I feel sick on the flight. Actually, I take that back, I might get a matcha instead. I still have to find my headphones and I think they are in my volleyball bag from Saturday. The best part is my mom is making her stuffing the day I land and she said she is not doing the boxed kind this year. Nothing beats the first night home.
