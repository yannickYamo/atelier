  - article [ref=e689]:
    - generic [ref=e690]: Trial 27 of 51
    - generic [ref=e692]:
      - generic [ref=e693]:
        - heading "A" [level=3] [ref=e694]
        - paragraph [ref=e695]: "**Up: Carl and Russell as a Two-Person Team**"
        - paragraph [ref=e696]: "Carl Fredricksen begins the film under external pressure from every direction: a construction firm is closing in on his house, and a court order has assigned him to Shady Oaks Retirement Village. Russell, a Wilderness Explorer working a senior-assistance badge, arrives on the porch as one more demand on a man who has no capacity left to absorb one. The team that forms between them is involuntary, badly matched, and it works â€” which makes it useful organizational data."
        - paragraph [ref=e697]: "Carl and Russell operate from opposite orientations, and the pairing holds because of the gap rather than in spite of it. Carl is going to lead through instruction and boundary-setting; Russell is going to lead through attention and disclosure. One example is the first night on the Venezuelan tepui, when Carl assigns Russell the sole task of pulling the house and tells him not to touch anything else, treating a ten-year-old as a task-oriented resource. Russell responds by talking â€” about his mother, about his father's absence, about counting cars. This is role conflict in miniature: Carl is running a mission with one deliverable (getting the house to Paradise Falls before the balloons deflate), while Russell is running a relationship. The friction is not waste. It is the mechanism by which the mission itself gets revised, which is what accountability inside a small team actually looks like."
        - paragraph [ref=e698]: The contrast sharpens against Charles Muntz, the explorer Carl idolized, who is running the same mission with none of the interference. Muntz has a crew (a loyal pack of collared dogs), a clear objective, and decades of persistence, and he has become dangerous â€” a leader whose culture shaping mechanisms all point inward at a single obsession. Carl has Russell, who keeps injecting a second objective. One example is when Carl chooses Kevin's capture over Russell's protest and then watches his house burn; the older leader learns, late, that mission fidelity without relational fidelity produces isolation, drift, and eventually harm.
        - paragraph [ref=e699]: The final act settles it. Carl empties the house of Ellie's furniture (and gives up the fifty-year artifact of his marriage) to lift the balloons and reach Russell on Muntz's dirigible. What sustained them was never Carl's expertise or Russell's badge requirements but a shared identity built in transit â€” the two of them, and Dug, an adopted dog with a broken collar, as a genuine unit. That is where trust, resilience, and morale come from in any organization.
        - paragraph [ref=e700]: "---"
        - paragraph [ref=e701]: "*Note: used the roster-in-apposition move for Dug and Muntz, and the future-tense-of-habit construction for the Carl/Russell contrast.*"
      - generic [ref=e702]:
        - heading "B" [level=3] [ref=e703]
        - paragraph [ref=e704]: "**Course Reflection: Carl and Russell in *Up* â€” Leadership in a Team of Two**"
        - paragraph [ref=e705]: Pixar's *Up* is not usually filed under organizational behavior, but the partnership between Carl Fredricksen and Russell offers a compact case study in how teams form, struggle, and ultimately outperform what either member could accomplish alone.
        - paragraph [ref=e706]: "The pair begins as an involuntary team â€” Russell is a stowaway, and Carl treats him as an obstacle rather than a colleague. This maps neatly onto Tuckman's *forming* and *storming* stages: role ambiguity, low trust, and open conflict over direction. Carl's early leadership style is transactional at best and avoidant at worst; he attempts to \"manage\" Russell by getting rid of him (the snipe hunt), the interpersonal equivalent of assigning busywork to a team member you don't value."
        - paragraph [ref=e707]: "What shifts the relationship is a slow accumulation of shared experience under stress. Leaderâ€“member exchange (LMX) theory suggests that relationships move from low-quality \"out-group\" transactions toward high-quality partnerships built on trust, mutual respect, and reciprocal obligation. Carl and Russell's arc traces exactly that path â€” from Carl grudgingly tolerating Russell to Carl abandoning the house (his stated goal, his sunk cost) to rescue him. That moment is the film's leadership pivot: Carl reprioritizes people over an inherited objective, which is essentially the move from task orientation to relationship orientation in the situational leadership models."
        - paragraph [ref=e708]: "Two other concepts feel especially relevant. First, **complementary competencies**. Russell brings energy, optimism, and a literal wilderness-badge skill set; Carl brings experience, judgment, and resources. Neither is redundant â€” the diversity of the dyad is the source of its capability, a small-scale demonstration of why team composition matters more than individual talent. Second, **generativity** in the Eriksonian sense: Carl's development is completed not by achieving his own goal but by mentoring someone else. Effective senior leaders often discover that their remaining value is in succession and sponsorship, not personal accomplishment. The final scene â€” Carl pinning the grape soda cap on Russell â€” is a mentorship handoff, a recognition ceremony, and a statement about what the \"organization\" now values."
        - paragraph [ref=e709]: The counterpoint is Charles Muntz, who represents leadership captured by a single obsessive goal. He has followers (the dogs), authority, and expertise, yet his refusal to update his mission produces a toxic culture and eventual collapse. Muntz is what Carl might have become.
        - paragraph [ref=e710]: "The takeaway for practice: teams are often assembled by circumstance rather than design, and the leader's job is to convert an accident into a partnership."
