        - paragraph [ref=e552]: "**Tuesday night â€” journal**"
        - paragraph [ref=e553]: Our rec team has a tournament in three weeks, and the back row has been leaking points all season. That pressure is why four of us showed up at the gym on a Tuesday to try a drill none of us had run before.
        - paragraph [ref=e554]: "The drill is simple on paper: one person tosses deep, two defenders cover the whole back court, and nobody rotates out until they've dug five clean balls in a row. It sounds easy until you're on ball fourteen and your legs are gone. One example is the third round, when Maya (our setter, and the only one of us who played in high school) shanked two in a row and the count reset. She swore, got low, and dug the next five without a word. Watching her do that reset the standard for the rest of us more than any pep talk would have. Accountability, in a group like ours, turns out to be modeled rather than announced."
        - paragraph [ref=e555]: What surprised me was how differently Maya and Devin handle the same failure. Maya is going to call out the mistake immediately â€” "you're standing straight up," she tells me, and she's right. Devin is going to wait until the rally ends and then say something like "that's a hard one, you were close." I used to think one of them was doing it wrong. Tonight I think the friction between them is exactly what kept us on the court for two hours. Having variance in how people lead a group can actually be the thing that holds the group together â€” the team gets both correction and confidence instead of choosing one.
        - paragraph [ref=e556]: By the last set nobody was counting anymore. Devin dives into the bleachers for a ball that was clearly out, and everyone loses it laughing, and then we go right back into the drill. That's the part I want to remember. We weren't better at defense because any of us got individually more talented in one evening; we stayed out there because of a shared culture we'd built without noticing, the kind of genuine affection that makes two more hours feel voluntary. Cohesion, morale, and resilience came from the group, not from the drill.
        - paragraph [ref=e557]: Three weeks. My legs hurt. I'll be there Thursday.
