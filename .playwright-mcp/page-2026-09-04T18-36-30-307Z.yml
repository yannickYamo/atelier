        - paragraph [ref=e774]: "**Journal â€” Nov 14**"
        - paragraph [ref=e775]: The seasonal menu comes down at the end of the month, which means I've got about two more weeks to settle this, and I've been putting it off since October. Ranking things I like is somehow harder than ranking things I don't.
        - paragraph [ref=e776]: "One example of the problem: the brown sugar shaken espresso versus the maple oat latte. The maple is going to win on the first sip every single time â€” it arrives sweet and immediately says *autumn*, no work required. But three-quarters of the way down the cup it turns cloying, and I end up drinking it fast just to be done. The brown sugar one starts flat, almost thin, and then keeps getting better as the ice melts (which is the whole trick â€” it's built to be drunk slowly). I switched allegiances sometime around the second week of October without noticing I'd done it."
        - paragraph [ref=e777]: The chai is a different category and I refuse to rank it against coffee. Marisol, the morning barista, makes it with actual steeped tea instead of the concentrate, and when she's not on shift I don't order it. So it's less a drink than a person.
        - paragraph [ref=e778]: Then the pumpkin cold brew, which I wanted to dismiss and couldn't. I ordered it once as a joke and then ordered it four more times, and the fourth time Dev â€” the one with the mustache, works Tuesdays and Thursdays â€” started making it before I got to the counter. Being known at a coffee shop is a small thing that is not actually small.
        - paragraph [ref=e779]: "So: brown sugar shaken first, pumpkin cold brew second, maple oat third, chai unranked and outside the system. The apple cider one is last, and I'm not going to defend that, I just didn't like it."
        - paragraph [ref=e780]: What I notice writing this down is that almost none of my rankings are about flavor. They're about how a drink behaves over twenty minutes, or who hands it to me. The best drink this season was the one I kept coming back for, and the reasons I kept coming back were mostly not in the cup.
        - paragraph [ref=e781]: "---"
        - paragraph [ref=e782]: "*Moves I reached for:* the parenthetical carrying the concrete stakes; a contrast pair (maple vs. brown sugar) as the spine; naming minor figures with their role in apposition; the future-tense-of-habit for a standing disposition. I left the abstract-noun verdict close alone â€” it would have been false here."
