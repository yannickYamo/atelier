        - heading "A" [level=3] [ref=e502]
        - paragraph [ref=e503]: I have finally gotten my overnight oats to where I want them, which took about three weeks of testing. I started with the basic recipe everyone does, one half cup of Bob's Red Mill old fashioned oats and one half cup of almond milk, but it was way too soupy in the morning and I hated that. So now I do a little less milk and I add two tablespoons of Dannon Oikos Greek yogurt, which makes it thick and creamy without adding a bunch of sugar. I also do a full tablespoon of chia seeds because they soak up the extra liquid and they are so good for you. The chia seeds are honestly the whole trick, I don't know why I waited so long. For sweetness I only use half a teaspoon of maple syrup now instead of the honey I was doing before, since the honey made it taste like a dessert and I would feel kind of sick by 10am. My favorite version right now is the stewed apple one, where I cook down a Honeycrisp with cinnamon on the stove the night before and layer it on top. Actually I take that back, the pumpkin one I made last week might be better, I did pumpkin puree with cinnamon and nutmeg and a little vanilla and it tasted like fall in a jar. My roommate tried it and said it needed more sugar but she puts sugar in everything so I am not taking that note. I make four jars on Sunday nights so I have them ready for early lifts, and I use the little Weck jars my mom sent me because the lids actually seal. I bring one with me and eat it in the car with a Starbucks iced americano, no sweetener. Waking up and already having breakfast made cannot be beaten.
