        - paragraph [ref=e1248]: Leadership Styles in Miracle
        - paragraph [ref=e1249]: In the movie Miracle, Herb Brooks takes over the 1980 U.S. Olympic hockey team and immediately makes it clear that this team is going to be built his way. From the very first tryout, he hands Craig Patrick (his assistant head coach) a list of players he already selected, telling the other evaluators he is not looking for "the best players," he is looking for the right ones. Coach Brooks is going to run the program like a dictator, while Craig Patrick is going to lead in a different manner, serving as the calm voice the players can actually approach.
        - paragraph [ref=e1250]: One example specifically is the famous "Again" scene after the exhibition tie in Norway. Brooks skates the team into the ground long after the arena lights are shut off, forcing them to repeat sprints until Mike Eruzione finally yells out that he plays for the United States of America. It is brutal, but it is a culture shaping mechanism, since Brooks wanted the players to stop identifying as Boston University or Minnesota guys and start building a shared identity. Craig Patrick stands off to the side during this and later pushes back privately, which gives the players someone to vent to without the whole thing turning into open rebellion.
        - paragraph [ref=e1251]: This dynamic is really what protects the team from burnout. The practice amounts would stay high all season and the behavior expectations were never lowered, but Patrick absorbs a lot of the emotional strain that Brooks creates on purpose. Brooks even says he does not need to be their best friend, he needs to be their coach, and that is a strong lesson in role conflict, a leader cannot always be the person offering comfort and the person demanding perfection at the same time. Having two leaders split those roles kept morale and engagement from collapsing (my volleyball team used a system like this, but different as well, our head coach pushed and our assistant listened).
        - paragraph [ref=e1252]: The payoff comes against the Soviet Union, when the conditioning and the trust in the vision and values finally show up in the third period. The players are not skating for Brooks at that point, they are skating for each other and for the shared goals he emphasis all year. Overall, this coaching dynamic built resilience, accountability and a team chemistry that allowed an underdog group of college kids to emerge victoriously on the biggest stage.
