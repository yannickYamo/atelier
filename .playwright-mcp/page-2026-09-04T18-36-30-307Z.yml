        - paragraph [ref=e509]: "One example is Sunday's jar, which I ruined on purpose to see where the line was. Half a cup of oats, a full cup of oat milk, and I let it go two nights instead of one. What comes out is a paste â€” edible, technically, but there's nothing to chew, and a breakfast you don't have to chew doesn't register as breakfast. The correction was smaller than I expected: three-quarters of a cup of liquid, one night only, and a spoonful of chia added at the start so the thickening happens from the chia rather than from the oats collapsing. That fixed the texture and it fixed the ratio problem at the same time (one jar, one scoop, no measuring cup at 10 p.m.)."
