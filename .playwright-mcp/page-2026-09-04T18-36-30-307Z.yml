        - paragraph [ref=e89]: Tomorrow is the big move and I have most of my stuff in boxes already, but my closet is still a disaster. My mom is driving up at 8am with the U-Haul and my dad is meeting us there around noon since he has work in the morning. I am mostly excited but also dreading carrying my mattress up two flights of stairs, my new place does not have an elevator which I did not realize until I signed the lease. My roommate Sydney is moving in the same day so we are going to be tripping over each other all afternoon. She already claimed the bigger closet, which is fine because I got the room with the window that faces the courtyard. We are ordering from Bucca di Beppo for dinner because you can feed like six people off one pan of chicken parm and my whole family will be there. Actually I take that back, I think we might just do Chipotle because it is closer and nobody wants to wait an hour. I already packed my Trader Joe's coffee and my little frother in a separate bag so I can make my morning latte the very first day, that is non negotiable. I need to remember to grab my Hokas from the hall closet, I left a pair behind at my last place and I never forgave myself. I also have to return my old router and pick up cleaning supplies, probably from Target on the way. My goal is to have my bed made and my desk set up by Sunday night so I can start the week feeling normal instead of living out of a suitcase. Sydney wants to hang the string lights first, which is very her. I bought a big pack of Dannon Oikos and some bananas so we have breakfast without unpacking the whole kitchen. Honestly the part I am looking forward to most is that first walk to the little bakery on the corner that everyone raves about. Fresh bread in a brand new kitchen cannot be beaten.
