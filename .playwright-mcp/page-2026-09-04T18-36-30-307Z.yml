    - generic [ref=e1176]: Trial 46 of 51
    - generic [ref=e1178]:
      - generic [ref=e1179]:
        - heading "A" [level=3] [ref=e1180]
        - paragraph [ref=e1181]: "## Leading Without the Title: *Erin Brockovich* and Informal Influence"
        - paragraph [ref=e1182]: Masry & Vititoe is a small firm with thin margins and no appetite for a case against a utility the size of PG&E, and the residents of Hinkley are sick without knowing why. The pressure comes from outside on both sides â€” a community with no medical explanation, a firm with no resources to find one â€” and everything that follows is a response to that squeeze.
        - paragraph [ref=e1183]: One example is the moment Erin, an unpaid clerk with no legal training, notices medical records filed inside a real estate case and refuses to let it go. She has no formal authority whatsoever; what she builds instead is referent power and, eventually, expert power. When she tells Ed Masry that she is "smart" and "hardworking" and wants the job, she is claiming legitimacy the org chart will not give her. Influence, this scene argues, is earned laterally through credibility, persistence, and trust rather than conferred by position.
        - paragraph [ref=e1184]: Ed Masry is going to lead in a different manner. He works through legitimate authority, procedure, and courtroom credibility, while Erin works door to door in Hinkley, sitting at kitchen tables. The friction is real â€” he cuts off her pay when she disappears for days, and later fires her outright â€” but the pairing is the engine of the case. Neither approach wins alone, and the resulting tension produces the accountability, rigor, and reach that a single style would never generate.
        - paragraph [ref=e1185]: "For instance, when Kurt Potter (a partner brought in for resources) and Theresa Dallavale (a credentialed attorney) push toward binding arbitration, the case stalls on a technical requirement: more than ninety percent of 634 plaintiffs must consent. Erin recovers the situation not with expertise but with relational capital â€” she recites plaintiffs' names, diagnoses, and children's ailments from memory. Theresa's dismissal turns to respect. This is a culture shaping mechanism in action, and it demonstrates the commitment, legitimacy, and moral authority that only sustained relationships produce."
        - paragraph [ref=e1186]: Hinkley held together, ultimately, because Erin gave a scattered set of neighbors a shared identity and a common story. Their resilience was never dependent on the firm's strategy; it came from mutual recognition and genuine affection built over hundreds of small conversations. The lesson for any organization is that solidarity, trust, and durable morale are cultural properties, not individual heroics.
        - paragraph [ref=e1187]: "---"
        - paragraph [ref=e1188]: "*Moves used:* minor characters named in apposition (Potter, Dallavale); future-tense-of-habit for Masry's standing style."
