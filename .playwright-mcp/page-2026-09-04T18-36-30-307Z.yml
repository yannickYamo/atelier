        - paragraph [ref=e1087]: The whole thing lasted nine days, which I'm told is about average, and the failure was not the part I'd braced for.
        - paragraph [ref=e1088]: "I'd stacked the mornings: 5:15 alarm, cold shower, twenty minutes of writing longhand, a run, no phone until eight. On paper it was ninety minutes. In practice it was ninety minutes *plus* the twenty I spent lying there negotiating with the alarm, plus the fifteen at the end where I stood in the kitchen genuinely unsure what the next thing was, because the routine had ended and the day hadn't started yet."
        - paragraph [ref=e1089]: Here's what I didn't predict. By day four I was fine in the mornings and useless by two in the afternoon. Not tired exactly â€” brittle. I snapped at Dana over something about a delivery window (a delivery window!) and then apologized in that overcorrecting way that makes an apology worse. The mornings kept getting better and the rest of me kept getting worse, and for about three days I refused to connect those two facts because the mornings were the part I was measuring.
        - paragraph [ref=e1090]: That's the actual thing, I think. I'd built a system that only produced evidence about itself. The journal filled up with entries about how good it felt to be journaling. No column anywhere for *how was four p.m.*
