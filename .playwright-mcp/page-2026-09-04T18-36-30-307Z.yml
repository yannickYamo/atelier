        - paragraph [ref=e274]: "**December 3**"
        - paragraph [ref=e275]: The building's holiday party collapsed two weeks out when the management company gave the community room to a leasing event, and by then half the third floor had already promised their kids cookies. So the exchange became the thing that had to work.
        - paragraph [ref=e276]: "Marisol (4B, who has hosted every potluck since I moved in) and I planned it in her kitchen on Sunday, and it was immediately obvious we were going to run it in different manners. She wants a signup sheet, assigned categories, a hard cap of six dozen per household. I want people to bring whatever they bring. For instance, when Dana texted asking whether store-bought counted, Marisol started drafting a reply about the spirit of the event and I just wrote back \"yes, obviously.\" We argued about it for twenty minutes. But the argument produced something neither of us would have gotten alone: a signup sheet with a category called *whatever you've got*, which is both a structure and a permission. Having variances in approach turned out to be a real asset here â€” the friction generated buy-in, accountability, and a plan people could actually see themselves inside of."
        - paragraph [ref=e277]: The other thing I keep thinking about is Tuesday, when Kevin (Dana's husband, who does not bake) offered to handle tables and coffee. Nobody asked him. He just saw the gap and stepped into it. That is the kind of moment that tells you what a group is actually made of. The volunteers came in fast after that â€” eleven households by Wednesday night, including two I've never spoken to (one of them brought up the flood in the laundry room last spring, unprompted, like it was a shared memory rather than a maintenance ticket). What held this together was never anybody's organizational talent. It was the accumulated goodwill of people who have carried each other's packages up three flights of stairs. Trust, shared identity, and a genuine affection for the place we live did more work than any signup sheet could.
        - paragraph [ref=e278]: Saturday at two. Marisol is bringing the labels. I am bringing nothing but a folding table and low expectations, which is, I think, its own contribution.
        - paragraph [ref=e279]: "---"
