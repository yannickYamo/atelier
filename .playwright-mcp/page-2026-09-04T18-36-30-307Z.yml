  - article [ref=e1124]:
    - generic [ref=e1125]: Trial 44 of 51
    - generic [ref=e1127]:
      - generic [ref=e1128]:
        - heading "A" [level=3] [ref=e1129]
        - paragraph [ref=e1130]: Organizational Change in Moneyball
        - paragraph [ref=e1131]: In the movie Moneyball, Billy Beane and Peter Brand take on the challenge of changing what an entire organization believes about talent, and they do it with almost no money and very little support. Billy is the general manager of the Oakland A's, and after losing three of his best players, he is forced to build a roster in a completely different way. Peter Brand is a young Yale economics graduate who has never played the game, but he sees value in players that everyone else has thrown away. The contrast between the two of them and the veteran scouts is what drives the whole story, since the scouts trust their eyes and their years of experience while Billy and Peter trust the numbers.
        - paragraph [ref=e1132]: One example specifically is when Billy sits in the scouting meeting and listens to the older scouts talk about a player's swing, his confidence, and even his girlfriend. Billy finally stops them and tells them they are asking the wrong questions, and that the problem is they are trying to replace Giambi when they should be replacing him "in the aggregate." He tells the room to "adapt or die." That moment is a clear example of resistance to organizational change, because the scouts are not being difficult for no reason, they genuinely believe in the process that has worked their entire careers.
        - paragraph [ref=e1133]: The way Billy shapes the culture is by removing anything that competes with the new vision. He trades players who do not fit the system, he takes the decision making away from his manager Art Howe, and he keeps the message simple for the players (my volleyball team did something similar when we simplified our serve receive goals, but different as well). Peter is the one who delivers the vision in a calm way, and Billy is the one who enforces the behavior expectations. Together they created shared goals in a clubhouse that had every reason to have low morale.
        - paragraph [ref=e1134]: A powerful instance is when the A's win their twentieth straight game after being down eleven to nothing, and Scott Hatteberg, a catcher who could no longer throw, hits the walk off home run. That win belonged to guys nobody else wanted, and it proved the system worked. Overall, this leadership built accountability and a shared identity that changed how the entire sport thinks today.
      - generic [ref=e1135]:
        - heading "B" [level=3] [ref=e1136]
        - paragraph [ref=e1137]: "**Moneyball: Changing What an Organization Believes**"
        - paragraph [ref=e1138]: The Oakland Athletics enter the 2002 offseason having lost Jason Giambi, Johnny Damon, and Jason Isringhausen to free agency, with a payroll roughly a third the size of the teams they are expected to beat. Billy Beane, the general manager, is told to replace three stars with money he does not have, and the organization's response to that pressure defines everything that follows.
        - paragraph [ref=e1139]: Beane's first act is not a trade but an attack on the front office's culture shaping mechanisms. One example is the scouting room scene, where the veteran scouts evaluate players by "the good face," swing mechanics, and the attractiveness of a player's girlfriend. Beane interrupts to reframe the entire discussion, insisting the club's problem is that it is trying "to replace Giambi" rather than recreate his aggregate production. By hiring Peter Brand, a Yale economics graduate with no baseball pedigree, Beane imports an outside knowledge base and signals that expertise in this organization will now be earned by evidence rather than tenure. The move damages morale among the scouts and costs Beane his oldest working relationships, but it establishes a new decision-making norm, and with it accountability, clarity, and organizational discipline.
        - paragraph [ref=e1140]: "Art Howe, the manager, is going to lead in a different manner than his general manager. Where Beane governs by system, Howe governs by convention and by his own contract year, and he simply refuses to write Scott Hatteberg into the lineup at first base. This is textbook role conflict: Howe answers to the clubhouse and to his own reputation, Beane answers to the ownership constraint. Beane resolves it by trading Carlos PeÃ±a outright, removing the alternative rather than winning the argument. The friction is real, yet it produces something neither man alone would have: a leader supplying the strategy and a leader absorbing the daily human cost of it, which is ultimately a strength for the franchise."
        - paragraph [ref=e1141]: What sustains the team through the early losing stretch is not talent, since by conventional measures the roster has very little. One example is Hatteberg's development at a position he has never played (having been released as a catcher with a ruined throwing elbow), coached patiently by Ron Washington. The resilience that carried the A's through a twenty-game winning streak came from a shared identity as undervalued players who had been discarded elsewhere. Their cohesion, trust, and collective belief demonstrate transformative leadership in practice.
        - paragraph [ref=e1142]: "---"
