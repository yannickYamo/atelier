      - generic [ref=e62]:
        - heading "A" [level=3] [ref=e63]
        - paragraph [ref=e64]: "**Reflection: A League of Their Own**"
        - paragraph [ref=e65]: "The All-American Girls Professional Baseball League exists only because the war has emptied the ballparks of men, and every roster knows the whole enterprise can be folded the moment the draft ends. The Rockford Peaches absorb that pressure twice over, because the manager assigned to them, Jimmy Dugan, does not want the job. What follows is best read as a contrast pair: Dugan leads by knocking down, and Dottie Hinson, the catcher, leads by picking up, and the team's season is the story of those two approaches converging."
        - paragraph [ref=e66]: Dugan's first weeks are pure abdication. He takes the lineup card, scratches it out without reading it, and sleeps off a hangover in the dugout while the players run themselves. One example is Dottie quietly assigning positions and calling pitches from behind the plate â€” textbook emergent leadership filling a formal vacuum. The team functioned, but on borrowed authority, and borrowed authority erodes accountability, clarity, and trust.
        - paragraph [ref=e67]: His second phase is presence without support. For instance, when Evelyn Gardner (right field) misses a cutoff and cries, Jimmy bellows that "there's no crying in baseball." This is task leadership stripped of any socioemotional dimension, contingent punishment applied to a workforce that has no exit option (these women left factories and farms and cannot simply transfer). Correction without care produced compliance and nothing resembling commitment.
        - paragraph [ref=e68]: "The turn comes when Jimmy starts absorbing cost instead of transferring it. He walks up to Evelyn, opens his mouth, visibly swallows the tirade, and coaches her â€” quietly, mechanically, on where to throw. Later he carries the War Department telegram into the locker room and freezes, unable to say whose husband it is, and Dottie takes it from him. That paralysis is role conflict in its clearest form: the manager's role demands he deliver the news, the human being cannot. Choosing restraint over discharge is a culture-shaping mechanism, and it bought him credibility, psychological safety, and morale he had not earned before."
        - paragraph [ref=e69]: "By the World Series, Jimmy signals a pitch, Dottie shakes him off, and he lets her have it. The authority is real now precisely because he no longer needs to enforce it. His line to Dottie â€” \"the hard is what makes it great\" â€” is transformative leadership in a sentence: reframing difficulty as meaning rather than as burden. Friction between his edge and Dottie's steadiness never resolved into one style, and the organization was stronger for holding both."
      - generic [ref=e70]:
        - heading "B" [level=3] [ref=e71]
        - paragraph [ref=e72]: Jimmy Dugan & Leadership Growth
        - paragraph [ref=e73]: In A League of Their Own, the Rockford Peaches are given a manager who does not want them, and watching Jimmy Dugan slowly become an actual coach is one of the strongest leadership arcs in the whole movie. At the start, Jimmy is a former star who is only there for the paycheck, and he sleeps through games, ignores the lineup card and leaves the real work to Dottie Henson, who is the catcher and the true leader in the clubhouse. The contrast between the two is clear early on, one has the title and the other has the trust.
        - paragraph [ref=e74]: One example specifically is when Evelyn misses the cut off and Jimmy screams at her until she cries, which leads to his famous line that there is "no crying in baseball." It is a low point for him as a leader, but it is also the moment he starts to notice the effect his words have on people. Later, you see a great scene where he coaches Evelyn on the same play calmly and walks her through it step by step, and she actually improves. This gesture shows he is beginning to understand that behavior expectations only work when they come with teaching and support.
        - paragraph [ref=e75]: As Jimmy buys in, the team chemistry changes with him. The players stop working around their manager and start playing for him, and he begins shaping the culture instead of hiding from it by setting a standard in practice and holding everyone accountable to it (my volleyball team had a coach make a shift like this, and it was a completely different gym after). Shared goals and a shared identity form because the Peaches finally have a leader whose vision matches their own effort.
        - paragraph [ref=e76]: The biggest instance is late in the season when Jimmy tells Dottie that quitting is easy and "the hard is what makes it great," a speech that comes from a man who quit on himself for years. He also lets Dottie stay in her leadership role rather than competing with her for it, which is a great example of transformative leadership since he grew the people around him instead of protecting his own ego. Overall, Jimmy Dugan's growth built morale, resilience and genuine trust, and it turned a group of overlooked players into a team that believed in each other.
