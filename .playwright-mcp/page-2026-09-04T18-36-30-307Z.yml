        - paragraph [ref=e961]: One moment settled it. The guy at the store puts me on the treadmill in each pair, thirty seconds barefoot first, and shows me the slow-motion clip of my ankles. In the cushioned pair my left foot collapses inward and I don't feel a thing (which is the problem â€” I've been running on that collapse for a year without knowing it). In the firmer pair the collapse is still there but smaller, and I can actually feel my arch working. He said the softer shoe wasn't wrong, just that it would "let you keep doing what you're doing." That landed harder than he meant it to.
