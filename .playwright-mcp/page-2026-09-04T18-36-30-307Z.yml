        - paragraph [ref=e827]: Everyone who came tonight arrived carrying something they'd been carrying all week. Marcus got through a layoff round at his office on Thursday, and Priya â€” my neighbor, three weeks into a new custody schedule â€” came late and apologized twice at the door. So the room started under a weight that had nothing to do with football.
        - paragraph [ref=e828]: "I host one way and my brother-in-law Danny hosts another, and I've stopped pretending mine is the better one. I prepare: the chili is on at noon, the chairs are counted, the extra folding table comes up from the basement. Danny doesn't prepare anything, he just fills whatever room he walks into. Where I try to remove the reasons a night could go wrong, he ignores them and talks to whoever looks least comfortable. The two approaches kept trading off all evening, and the party needed both of them."
        - paragraph [ref=e829]: One example is the second quarter. The game is a blowout by then and the conversation is dying, so I do what I always do and start refilling bowls nobody asked me to refill. It buys about ten minutes. What actually saves the stretch is Danny dragging Marcus into an argument about a punt return from 2011 that neither of them remembers correctly. Preparation held the floor; presence held the people.
        - paragraph [ref=e830]: For instance, at halftime Priya went out to the porch alone. I noticed and stayed inside, because I thought she wanted the air. Danny went out after four minutes with two plates. She came back in laughing at something and stayed until midnight. I was right about the air and wrong about the timing, and I'm still thinking about that.
        - paragraph [ref=e831]: What I keep coming back to is that none of it was the food or the television. Those people have twelve years of small history with each other, and that history did the work â€” the shared jokes, the standing seating order nobody assigns, the genuine affection that lets somebody sit quietly in a loud room without it meaning anything. The evening held because the group already held. A watch party doesn't build that; it just gives it somewhere to show up. Trust, ease, generosity, belonging â€” that was the real scoreline tonight.
