  - article [ref=e1049]:
    - generic [ref=e1050]: Trial 41 of 51
    - generic [ref=e1052]:
      - generic [ref=e1053]:
        - heading "A" [level=3] [ref=e1054]
        - paragraph [ref=e1055]: Leadership Styles in The Karate Kid
        - paragraph [ref=e1056]: In the movie The Karate Kid, the two instructors could not be more different, and the way each one leads shapes the young men who train under them. Mr. Miyagi is quiet, patient, and invested in Daniel as a person, while John Kreese runs Cobra Kai like a military unit where winning is the only measure of worth. Both men are teaching karate, but only one of them is actually developing people.
        - paragraph [ref=e1057]: One example specifically is when Mr. Miyagi has Daniel wax the cars, sand the deck, and paint the fence for days without any explanation. Daniel becomes frustrated and feels used, until Miyagi shows him that every chore was building the muscle memory for a block. That moment of "wax on, wax off" is a great instance of transformative leadership since the follower is being built up for the long term instead of being pushed for a quick result. Kreese, on the other hand, emphasis fear and aggression in every session, and his behavior expectations are made clear in the phrase "no mercy." His students perform, but they perform out of pressure rather than belief.
        - paragraph [ref=e1058]: The effect on each group is very clear. Cobra Kai has skill and discipline, however the culture is built on intimidation, and you see the burnout and role conflict in Johnny when he is asked to hurt someone he does not want to hurt. Daniel only has one training partner, but he has trust, shared goals, and a leader who shows up for him at the tournament and at home. The chemistry between Miyagi and Daniel is genuine, while the chemistry inside Cobra Kai is really just compliance (my volleyball team had a coach who led through fear one season, and the room felt very similar).
        - paragraph [ref=e1059]: The biggest moment comes when Daniel is injured and asks to keep fighting anyway. Miyagi does not order him back out, he heals him and lets him make the choice, which builds accountability and ownership in a way that yelling never could. Kreese in the same situation tells his student to take out the leg, and he loses the respect of his own team in front of everyone. Overall, this contrast shows that culture shaping mechanisms come from how a leader treats people under stress, and Miyagi's approach built the trust, morale, and resilience that carried Daniel through his biggest challenge.
      - generic [ref=e1060]:
        - heading "B" [level=3] [ref=e1061]
        - paragraph [ref=e1062]: "**Reflection: Leadership Lessons from *The Karate Kid***"
        - paragraph [ref=e1063]: The Cobra Kai dojo operates under constant competitive pressure, with the All Valley Under-18 Karate Championship functioning as the organization's only performance metric. Daniel LaRusso, a transplant with no standing in that environment, enters a climate where physical intimidation is the accepted currency. Everything that follows in the film is a response to that pressure.
        - paragraph [ref=e1064]: "John Kreese leads through coercive power and fear. One example is the opening instruction at the dojo, where he drills the students on the creed \"strike first, strike hard, no mercy,\" and the class answers back in unison. This is a culture shaping mechanism in its purest form: the values are recited, rewarded, and enforced through public correction. Kreese gets short-term compliance and a highly skilled roster, but he builds no trust, no psychological safety, and no accountability that survives his absence."
        - paragraph [ref=e1065]: Mr. Miyagi is going to lead in a different manner and build a person up where Kreese breaks one down. One example is the wax-on, wax-off sequence, where Daniel spends days sanding, painting, and waxing (unpaid, and with no explanation of the purpose) before he throws a single block. When Daniel finally accuses him of wasting his time, Miyagi demonstrates that the labor was the training. That single reveal converts frustration into commitment, and it establishes the kind of trust, patience, and internal motivation that no creed shouted in unison can manufacture.
        - paragraph [ref=e1066]: "The contrast sharpens in the tournament. One example specifically is when Kreese orders Bobby Brown, one of his senior students, to injure Daniel's knee illegally. Bobby hesitates, complies, and immediately apologizes on the mat. This illustrates role conflict at its most costly: the obligations of the follower role collided directly with his personal ethics, and the organization's culture gave him no legitimate way to refuse. Kreese's authority produced the act and destroyed the loyalty behind it in the same moment."
        - paragraph [ref=e1067]: Even so, having opposing leadership philosophies inside one competitive system proved productive. Kreese's intensity set a standard of technical excellence that forced Miyagi's approach to prove itself under real conditions, and Daniel's resilience was ultimately not dependent on either instructor's commands but came from the shared respect and identity he built with Miyagi. When Johnny Lawrence hands over the trophy at the end, the gesture confirms which culture actually earned durable respect, morale, and accountability.
