        - paragraph [ref=e165]: "The haul: a bunch of rainbow chard, half a flat of the last tomatoes (soft, split at the shoulders, priced to move), two heads of garlic, a pound of shiitakes, a butternut squash, a quart of cider, and a loaf of something seeded and heavy enough to be a weapon. Marisol, the mushroom grower who's been at the same corner table since I started coming, told me to \"cook them dry first, before the butter,\" which I have heard from her three autumns running and ignored twice."
        - paragraph [ref=e166]: "So: tonight, the tomatoes, because they won't wait. I halve them, salt them, and let them slump in a low oven for two hours while I do nothing useful. That becomes sauce, or it becomes toast with the seeded bread, depending on how ambitious I feel at seven."
        - paragraph [ref=e167]: Tomorrow the squash. I roast it in wedges and eat half standing at the counter, which is not a recipe but is what happens. The rest gets pureed with cider and a little of the garlic for soup, and the soup carries Monday and probably Tuesday.
        - paragraph [ref=e168]: The chard is the one I keep failing. Every week I buy it with real conviction and every week it turns to a wet gray thing in the crisper drawer. This week I'm stripping the stems the moment I get home and pickling them, so the leaves have to become dinner on their own â€” wilted into the mushrooms, which I will finally cook dry first.
        - paragraph [ref=e169]: I spent forty-one dollars. It's more than the grocery store and I don't especially want to defend it. What I got was one morning where the food had a person attached to it, and a week that's already half-decided.
        - paragraph [ref=e170]: "---"
        - paragraph [ref=e171]: "*Optional moves used:* I identified Marisol in apposition by name and role (p6), and quoted her only as a fragment inside my own sentence rather than setting it off (p3). I opened on the external pressure â€” closing time, one hour, a week of dinners (p9) â€” and let the tense drift from past narration into present for the cooking itself (p17). I skipped the verdict-sentence habit and the coursework vocabulary entirely; neither belongs in a journal entry about chard."
      - generic [ref=e172]:
        - heading "B" [level=3] [ref=e173]
        - paragraph [ref=e174]: I went to the farmers market this morning right when it opened at 8, which is the best time to go because the good stuff is gone by 10. I got two pints of strawberries from the stand at the end, a bunch of rainbow chard, four heirloom tomatoes, a big bag of Persian cucumbers and some fresh basil. The strawberries were 6 dollars a pint which felt like a lot but they are so much better than the Safeway ones, no comparison. My roommate Sadie came with me and she got a loaf of sourdough and a jar of local honey from the beekeeper guy who always lets you taste three kinds. I tried the orange blossom and the wildflower and I liked the wildflower more, although Sadie says the orange blossom is the better one. Tonight I am going to make a big tomato and cucumber salad with the basil, olive oil and a little flaky salt, and I want to do the chard sauteed with garlic as a side. I am also thinking about making overnight oats with the strawberries and my Dannon Oikos Greek yogurt and chia seeds for the week, since I have 6am lift on Tuesday and Thursday and I never want to cook in the morning. Actually I take that back, I want to save some strawberries plain because they are honestly best just eaten out of the container standing at the counter. I did not buy eggs this time which I regret, the egg lady had a line the whole time. Next week I want to get peaches while they are still in season and try that thing where you grill them and put yogurt on top, no added sugar needed since they are already sweet enough. Farmers market Saturday might be my favorite part of the whole week, the food actually tastes like something.
