  - article [ref=e1232]:
    - generic [ref=e1233]: Trial 48 of 51
    - generic [ref=e1235]:
      - generic [ref=e1236]:
        - heading "A" [level=3] [ref=e1237]
        - paragraph [ref=e1238]: "**Miracle: Two Coaches, One Bench**"
        - paragraph [ref=e1239]: The 1980 U.S. Olympic hockey team assembled under enormous external pressure â€” a roster of college amateurs given seven months to prepare for a Soviet program that had beaten NHL All-Stars and won four straight gold medals. Every choice Herb Brooks makes is a response to that gap, and every choice Craig Patrick makes is a response to Brooks.
        - paragraph [ref=e1240]: "Brooks establishes his culture before a single player is evaluated. One example is the tryout camp in Colorado Springs, where he hands the selection committee a completed twenty-six-man list on day one and defends it by saying he is \"not looking for the best players,\" he is looking for the right ones. This is a culture shaping mechanism deployed at the point of entry: what gets selected for signals what gets valued. Fit over talent, system over reputation â€” the roster itself became the first statement of identity, discipline, and shared purpose."
        - paragraph [ref=e1241]: Patrick is going to lead in a different manner. Where Brooks isolates himself as the common enemy, Patrick (assistant coach and, later, general manager) absorbs the fallout and keeps the relational channel open. For instance, after the 3â€“3 exhibition tie in Norway, Brooks skates the team to collapse in a darkened rink while Patrick and Doc Nagobads (team physician) stand at the boards arguing that it has gone too far. Brooks tells Patrick that the team hating him is "the idea." That exchange is textbook role conflict â€” Patrick owes loyalty upward to his head coach and duty downward to exhausted players â€” and he resolves it by becoming the counterweight rather than the opponent. Brooks knocks a player down and Patrick picks him up, and the deliberate division of that emotional labor produced cohesion, trust, and accountability that neither man could have generated alone.
        - paragraph [ref=e1242]: The payoff appears when the leadership stops being external. One example is the locker room confrontation with Rob McClanahan over a bruised thigh (with the Czech game already slipping away), where Brooks provokes the room and the players close ranks around their teammate instead of scattering. By Lake Placid, the team's resilience no longer depended on Brooks's commands; it came from a shared identity the players enforced on each other.
        - paragraph [ref=e1243]: Transformative leadership in *Miracle* is not one voice but a paired system, and having variances in leadership style can actually be a great thing for an organization under pressure.
        - paragraph [ref=e1244]: "---"
        - paragraph [ref=e1245]: "*Optional moves used:* I identified Doc Nagobads and Patrick by role in apposition on first mention, and used the future-tense-of-habit construction (\"is going to lead in a different manner\") to state Patrick's standing disposition rather than a single instance."
      - generic [ref=e1246]:
