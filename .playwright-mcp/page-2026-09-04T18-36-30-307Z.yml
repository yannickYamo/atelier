        - heading "A" [level=3] [ref=e1106]
        - paragraph [ref=e1107]: I just finished my first week at the new gym and I am obsessed already. It is called Fitness SF and it is about a ten minute drive from my apartment, which is way better than the old place I had to walk twenty minutes to in the rain. I signed up on Monday and the front desk girl, Marissa, gave me a whole tour and a free shaker bottle, so I already like it there. The weight room is huge and they have four squat racks so I never have to wait, which was my biggest complaint before. I did legs Monday, upper body Tuesday, and then Wednesday I tried the 6am spin class with my roommate Jules and I could barely walk after. The instructor plays all 2000s throwback music and I was dying but also smiling the whole time. Thursday I just did the treadmill and stretched because I was so sore. My new lifting shoes came in on Friday, they are the Nike Metcons in the all white colorway and they are so much better than my old ones. The locker rooms are clean and they have those good eucalyptus towels, although I still shower at home because I am picky about that. After my Saturday workout Jules and I went to the Starbucks in the same shopping center and I got an iced matcha with no classic syrup because they put way too much sugar in it otherwise. Actually I take that back, I got a cold brew on Tuesday and that might be my favorite. I have been making my breakfast smoothie every morning with frozen banana, spinach, peanut butter and Fairlife protein milk and it holds me over until lunch. I already signed up for the Monday spin class again next week. Getting up at 5:15 is rough but honestly nothing beats being done with your workout before the day even starts.
