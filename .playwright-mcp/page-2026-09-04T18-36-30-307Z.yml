        - paragraph [ref=e1303]: My long run this morning was supposed to be 12 miles and it turned into one of the worst runs I have had in a while. I woke up late because I forgot to plug in my phone, so I skipped breakfast and just had a few sips of chocolate milk on the way out the door. My Garmin would not find satellites for almost five minutes and I stood in the driveway getting cold, which is never a good start. Around mile three my left shoe started rubbing and I realized I grabbed my older Hokas instead of the new pair, and by mile five I could feel a blister forming on my heel. I only brought one Nuun tablet and no gels, which was dumb, so I got really lightheaded around mile eight and had to walk for a bit by the creek trail. Then it started raining, not hard, just enough to soak my socks. My friend Hattie was supposed to meet me at mile six but she texted that she overslept and I did not see it until I finished. I ended up cutting it at 10 miles and walking the last half mile home feeling pretty defeated. When I got back I made my usual recovery bowl with Dannon Oikos Greek yogurt, chia seeds and frozen blueberries, and I did not add any honey because I already had too much sugar this week. Then I took the longest shower and put a bandaid on the blister. Tomorrow I am going to do an easy shakeout and go to Starbucks after with my roommate, although I really want to try the new matcha place by the Stanford mall instead. Their iced matcha with oat milk and no sweetener is the best thing ever.
