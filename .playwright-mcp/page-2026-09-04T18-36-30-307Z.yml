        - paragraph [ref=e959]: My old trainers finally gave out this week â€” 480 miles, the outsole worn smooth on the left heel, and a dull ache in my right knee that showed up on Tuesday's easy run and hasn't fully left. There's a half marathon in nine weeks. So the shoe decision stopped being a hobby question and became a deadline question, which is how most of my decisions seem to get made.
