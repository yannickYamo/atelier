        - heading "A" [level=3] [ref=e608]
        - paragraph [ref=e609]: "# Improvisation and Structure: Leadership Lessons from *School of Rock*"
        - paragraph [ref=e610]: Horace Green Prep is a school under constant external pressure, where parents pay for results and the principal is judged on rankings rather than on the wellbeing of her students. Into that pressurized environment walks Dewey Finn, an unqualified substitute posing as his roommate Ned Schneebly, and the tension between his improvisational approach and Principal Rosalie Mullins's rule-bound one becomes the real story of the classroom.
        - paragraph [ref=e611]: "One example is the moment Dewey overhears the students' music lesson and begins assigning band roles on the spot. He hears Zack (guitar) play a riff in the hallway and immediately recasts him as lead guitarist, moves Katie from cello to bass, and puts Freddy behind the drum kit. This is a textbook culture shaping mechanism: Dewey signals what the group values by what he pays attention to and rewards. Trust, engagement, and intrinsic motivation followed almost immediately."
        - paragraph [ref=e612]: For instance, when Summer objects to being made a "groupie" and negotiates her way into becoming band manager, Dewey does not defend his original decision. He hands her a real portfolio (contracts, logistics, and the actual booking of the Battle of the Bands slot). The role conflict she experiences between star student and background player is resolved not by discipline but by redesigning the role around her strengths, and the result is accountability, ownership, and a manager who outworks everyone in the room.
        - paragraph [ref=e613]: Mullins is going to lead in a different manner and enforce the standard when Dewey bends it. Their conflict comes to a head over the beer scene at the bar, where Dewey gets her to admit she once loved Stevie Nicks and had "the best voice." Mullins provides the structure that keeps the institution credible; Dewey provides the permission that makes the students take risks. Having variances in leadership style can actually be a great thing for an organization, because one leader picks a student up when the other has had to hold a line.
        - paragraph [ref=e614]: The clearest evidence is what happens after Dewey's fraud is exposed. The class does not disband; the students collect him, load the van, and get themselves to the venue. Their resilience was no longer dependent on Dewey's presence at the front of the room but came from a shared identity as a band. Cohesion, commitment, and collective efficacy had outlasted the leader who created them.
        - paragraph [ref=e615]: "---"
        - paragraph [ref=e616]: "*Note: I used the roster-in-apposition move for the minor characters, and the future-tense-of-habit construction for Mullins's standing disposition.*"
      - generic [ref=e617]:
        - heading "B" [level=3] [ref=e618]
        - paragraph [ref=e619]: "**Reflection: Leadership Lessons from *School of Rock***"
        - paragraph [ref=e620]: "Dewey Finn is, by every formal measure, an illegitimate leader. He holds no credential, no positional authority, and no honest mandateâ€”he is impersonating a substitute teacher. Yet within days he mobilizes a room of disengaged prep-school students into a cohesive, high-performing band. That paradox is what makes the film a useful case study: it separates *authority* from *influence*."
        - paragraph [ref=e621]: "Dewey's power base is almost entirely referent and expert (French & Raven). The students follow him not because the institution says they must, but because he demonstrates genuine mastery of something they find compelling and because he treats them as capable collaborators. His first substantive act is diagnostic: he auditions the class, listens, and assigns roles based on demonstrated strengthsâ€”Zack on guitar, Katie on bass, Lawrence on keyboards. This is strengths-based role design, and it produces immediate buy-in because each student sees a clear line between their individual contribution and the collective outcome."
        - paragraph [ref=e622]: "He also distributes leadership rather than hoarding it. Summer, initially a threat to his authority, becomes band manager; Billy takes costume design; a lighting and security crew forms. Dewey converts potential resistance into ownership, an example of shared leadership that expands the team's capacity beyond his own. His approach maps closely to transformational leadership: idealized influence (he embodies the mission), inspirational motivation (the Battle of the Bands as a vivid, shared goal), individualized consideration (his coaching of Lawrence, who fears he isn't \"cool enough\"), and intellectual stimulation (rewriting the rules of what school can be)."
        - paragraph [ref=e623]: Underneath is a deliberate cultivation of psychological safety. In Dewey's classroom, mistakes are part of practice, self-expression is rewarded, and Zack can bring an original song without fear of ridicule. This shift from extrinsic motivators (grades, gold stars, parental approval) to intrinsic onesâ€”autonomy, competence, relatednessâ€”explains the students' sudden discretionary effort.
        - paragraph [ref=e624]: The film's honest complication is ethical. Dewey's influence rests on deception, and he initially instrumentalizes the students for his own redemption. Charisma without integrity is fragile; his exposure nearly destroys everything. What redeems him is that the team, by then, has real capability of its own and chooses to continue. The culture outlived the founder's fraud.
        - paragraph [ref=e625]: "The takeaway I keep returning to: authority can compel compliance, but only credibility, meaningful work, and genuine belief in people's potential generate commitment. Dewey's methods are indefensible; his instincts about human motivation are not."
