        - heading "A" [level=3] [ref=e722]
        - paragraph [ref=e723]: We are heading to Half Moon Bay tomorrow morning and I am so excited because it is the first time the whole group has been together since May. Kenzie is driving and she said we have to leave by 8 so we can beat the parking situation, which is fair but I am not a morning person on the weekends. I already packed my bag with my Stanley, sunscreen, and two towels since the sand always gets on everything. We are stopping at the Starbucks on the way and I am getting a cold brew with oat milk, no sweetener, because they add way too much syrup and it makes me feel awful an hour later. I made a batch of banana oat cookies last night, probably 24 of them, and I am bringing my Dannon Oikos Greek yogurt with chia seeds for the drive. Everyone is bringing something so we should have plenty of food. Sam is bringing sandwiches from that deli in Redwood City and Hattie is making her pasta salad, which honestly is the best thing anyone brings, although the sandwiches are a close second. My best friend Hattie is the assistant coach now since she graduated from the team, so she has been busy all fall and I barely see her. We are going to play some beach volleyball but I am definitely rusty, indoor and sand are so different. Then I think we will walk down toward the tide pools if it is not too cold, and if there is time we might get dinner in Pescadero. I want to wear my Hokas but I am nervous about them getting sandy, so maybe I will just do slides. Last time we did this trip I got a lavender honey ice cream that was amazing. Actually, I take that back, the strawberry one my roommate got was better and I was a little jealous. The whole day is just easy and there is no pressure. Being back with those girls is the best feeling ever.
