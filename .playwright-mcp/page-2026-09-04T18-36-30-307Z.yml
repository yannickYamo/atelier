        - paragraph [ref=e486]: Leadership Without a Coach
        - paragraph [ref=e487]: In the movie The Sandlot, there is no coach, no parents at practice, and no organized league, but the group of boys still builds one of the strongest team cultures you will see on screen. The leader of the group is Benny "The Jet" Rodriguez, who is clearly the most talented player, but he never uses that talent to separate himself from anyone else. On the other side you have Scotty Smalls, the new kid who does not know who Babe Ruth is and cannot throw a ball, and the contrast between those two is what drives the whole culture of the sandlot.
        - paragraph [ref=e488]: One example specifically is when the boys are one player short and Benny brings Smalls into the game even though Smalls just embarrassed himself in the outfield. Instead of letting Ham Porter and the others run him off, Benny walks over, tells him to keep the glove, and then takes him out back to teach him how to catch. This gesture by Benny establishes behavior expectations for the entire group since he is showing everyone that including the new guy is not optional, it is the standard. From that point on the boys stop testing Smalls and start protecting him.
        - paragraph [ref=e489]: The team chemistry that comes out of this is why they can play every single day all summer without any adult telling them to show up. They have a shared identity and shared goals (my volleyball team had unwritten rules like this too, just with a lot more running), and the accountability is peer to peer instead of top down. Ham emphasis this constantly with lines like "You're killing me, Smalls!", but it is never mean spirited, it is a way of holding each other to a level. Everyone has a role and everyone knows their role as well.
        - paragraph [ref=e490]: The biggest moment is when Smalls hits the Babe Ruth ball over the fence and the team has to face The Beast. Nobody quits on him, they build contraptions, they problem solve, and finally Benny goes over the fence and runs the ball down himself. That resilience only happens since there was trust built long before the crisis ever showed up. Overall, The Sandlot shows that culture is not created by a title or a whistle, it is created by how the most respected person in the group treats the least experienced one.
