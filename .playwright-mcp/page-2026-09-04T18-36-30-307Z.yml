        - paragraph [ref=e726]: "**June 14**"
        - paragraph [ref=e727]: It has been nine years since all seven of us were in one place, and the thing pressing on the group now is not a season or a scoreboard â€” it's distance. Two states, three jobs, one divorce, and Rob's mom in hospice since March. We picked the beach because it was halfway for nobody and easy for everyone.
        - paragraph [ref=e728]: "One moment I keep coming back to: Rob shows up an hour late with the wrong cooler (no ice, all beer), and instead of anyone giving him grief, Danny just walks the half mile to the gas station and comes back with two bags. Nobody narrated it. Nobody made it a gesture. That's what old trust looks like when it's still working â€” quiet logistics, no ledger."
        - paragraph [ref=e729]: Marcus and Danny are still the same contrast they always were. Marcus needles â€” he had Rob's cooler in the group chat before dinner, photo and all. Danny picks people up; he's the one who asked Rob about his mom while the rest of us were busy pretending the water wasn't freezing. It used to feel like friction. Watching it from a beach chair at thirty-one, I think the group needs both, and always did. The needling keeps us honest and the propping-up keeps us here. Accountability and care, running on two separate engines.
        - paragraph [ref=e730]: For instance, the pickup game at four. Seven of us, bad knees, one football that had been in somebody's trunk since 2019. Marcus starts talking trash inside of a minute (and pulls something in his calf inside of three), and Danny reorganizes the teams so Rob gets the ball twice on the opening drive. Neither of them planned it. The group just fell into its old shape the way water finds a low spot.
        - paragraph [ref=e731]: "What held tonight wasn't anybody's talent. None of us are athletes anymore in any sense that matters. It held because there's a shared history none of us has to explain out loud â€” a culture we built in a weight room at sixteen and apparently never dismantled. Belonging, loyalty, resilience: those didn't come from the reunion. They were already there, waiting to be used."
        - paragraph [ref=e732]: Drove home sunburned on one shoulder and thinking I should stop treating these as rare.
