        - paragraph [ref=e20]: "**Journal â€” Sunday**"
        - paragraph [ref=e21]: The four of us have been talking about Whitefish since October, and the number that keeps coming back is one none of us actually has. Rent went up in January for me and for Dana both, and the trip has quietly become a thing we all want and none of us wants to be the first to admit we can't afford.
        - paragraph [ref=e22]: So Tuesday night I sit down at the kitchen table with the laptop and a legal pad and finally build the spreadsheet. Lodging split four ways, lift tickets (three days, not four â€” the fourth day is where the whole thing tips over), gas, rentals, the food line I always underestimate. Seeing it broken out was less frightening than carrying it around as a vague dread. Writing the number down turned anxiety into arithmetic, and arithmetic I can negotiate with.
        - paragraph [ref=e23]: "One example of how differently we approach this: Dana is going to run the trip on feel where I run it on the sheet. She sends the group chat a photo of a chalet at eleven at night with three fire emojis and no price. I send back a column. For about a day I was annoyed â€” it felt like I was doing the unglamorous half of the work while she did the fun half. But her instinct to ask \"what are we actually going for\" caught something my spreadsheet missed: I had budgeted us into a place forty minutes from the mountain to save ninety dollars. Having two ways of looking at the same trip made the plan better than either of us would have made alone."
        - paragraph [ref=e24]: The other moment worth remembering is the call with Marcus (the one of us with the least slack this spring). I had braced for him to bow out. Instead he said he'd come for two days and drive his own car, and nobody made it weird. That was the part I keep thinking about â€” not the money, but how easily it got said. Honesty about money is cheaper than the resentment that grows in its absence.
        - paragraph [ref=e25]: "Final number: $612 each. I moved sixty dollars a week into the separate account starting today. It is a real trip now, and it is smaller and more honest than the one we were imagining."
