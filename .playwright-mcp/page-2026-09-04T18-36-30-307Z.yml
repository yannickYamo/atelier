    - generic [ref=e420]: Trial 17 of 51
    - generic [ref=e422]:
      - generic [ref=e423]:
        - heading "A" [level=3] [ref=e424]
        - paragraph [ref=e425]: Culture, Access, & Change
        - paragraph [ref=e426]: In the movie Hidden Figures, the culture at NASA does not change because someone gives a big speech about fairness, it changes when leaders finally remove the barriers that were keeping talented people from doing the job they were hired for. Katherine Johnson is the strongest mathematician in the building, but she is spending forty minutes a day running across campus to the colored restroom while the entire Space Task Group sits and waits on her calculations. The contrast between Al Harrison and Paul Stafford is clear from the start, one leader cares about the mission and the other cares about the pecking order.
        - paragraph [ref=e427]: One example specifically is when Harrison confronts Katherine about her absences and she finally breaks down and explains the half mile walk, the separate coffee pot with her name taped on it, and the pearls she cannot afford on her salary. Harrison takes a crowbar to the "Colored Ladies Room" sign and tells the room that at NASA "we all pee the same color." That is a culture shaping mechanism in one moment, he did not write a new policy, he made a symbolic act in front of everyone so the behavior expectations were impossible to misread.
        - paragraph [ref=e428]: The effect on the group was immediate. Once Katherine has access to the data without the redactions Stafford was making, and once she is allowed into the Pentagon briefings, the whole team gets faster and the trust level goes up since there was finally a shared goal instead of a hierarchy protecting itself. Harrison emphasis over and over that he needs numbers he can bet a man's life on, and that standard applied to every person in the room equally (my volleyball team had a rule like this too, the starters were held to the same expectations as everyone on the bench). Vivian Mitchel and the other supervisors slowly adjust because the results speak louder than the old habits.
        - paragraph [ref=e429]: The biggest moment comes when John Glenn will not launch until "the smart one" checks the numbers by hand, and Katherine runs the report out to the control room herself. Dorothy Vaughan does something similar by teaching herself FORTRAN and bringing her entire team of women with her instead of going alone, which is transformative leadership in the simplest form. Overall, the culture changed because leaders paired a high standard with real access, and that combination built trust, morale, and lasting accountability.
      - generic [ref=e430]:
        - heading "B" [level=3] [ref=e431]
        - paragraph [ref=e432]: "**Hidden Figures: What Actually Changed the Culture**"
        - paragraph [ref=e433]: "Langley's West Computing group works under enormous external pressure: the Soviets have put a satellite and then a man into orbit, and NASA is being publicly measured against a deadline it cannot move. That pressure is what makes the culture around Katherine Johnson visible, because a segregated workflow that merely embarrassed the organization in peacetime now costs it hours it does not have."
        - paragraph [ref=e434]: The film's argument runs through a contrast pair. Al Harrison, head of the Space Task Group, is going to lead by removing barriers, while Paul Stafford, the lead engineer, is going to lead by defending the boundary of his role. One example is the half-mile walk to the colored bathroom in the West Area building. Harrison does not counsel Katherine on resilience; he takes a crowbar to the sign and tells the room that at NASA "we all pee the same color." This is a culture shaping mechanism in its purest form â€” a leader spending position power on a symbol, and thereby setting attention, precedent, and permission for everyone watching.
        - paragraph [ref=e435]: "Stafford is the more instructive case. He blacks out the numbers in the documents he hands Katherine and keeps her out of the briefings, which illustrates role conflict: he is asked to produce a verified trajectory while protecting a hierarchy that suppresses the only person able to verify it. When Katherine finally stands at the blackboard and works the Frenet equations in front of the Pentagon men, expert power overrules position power in real time. The friction between Stafford's rigor and Harrison's openness was not wasted; it forced the group to justify its methods and made the eventual verification credible. Having variances in leadership can genuinely strengthen an organization."
        - paragraph [ref=e436]: Dorothy Vaughan (acting supervisor of West Computing, unpaid) supplies the second pair against Vivian Mitchell, her white supervisor. Dorothy teaches herself FORTRAN and then trains her entire section before the IBM 7090 makes them redundant, moving thirty women into the new work rather than saving one seat. That is transformative leadership â€” building capacity in others instead of competing for scarcity.
        - paragraph [ref=e437]: What held these women together through the arc was not individual brilliance or fortunate timing. It was a shared identity forged in the West Area room and a genuine mutual regard that outlasted any single assignment. The trust, accountability, and morale that resulted were what the culture finally could not out-argue.
        - paragraph [ref=e438]: "*Note: this draft used the parenthetical stakes and the future-tense-of-habit construction; minor figures are named with their roles on entry.*"
