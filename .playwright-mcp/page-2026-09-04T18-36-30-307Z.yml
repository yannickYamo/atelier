    - generic [ref=e663]: Trial 26 of 51
    - generic [ref=e665]:
      - generic [ref=e666]:
        - heading "A" [level=3] [ref=e667]
        - paragraph [ref=e668]: Discipline, Care, & Accountability
        - paragraph [ref=e669]: In the movie Coach Carter, Ken Carter takes over a struggling Richmond High basketball program and immediately sets a standard that the players have never been asked to meet before. He hands out contracts that require a 2.3 GPA, class attendance, and a shirt and tie on game days, and he refers to every player as "sir." The contrast here is clear, the players are used to being valued only for what they can do in the gym, while Coach Carter is going to lead them as students first and athletes second.
        - paragraph [ref=e670]: One example specifically is when Coach Carter finds out several players are failing their classes and he chains the gym doors shut in the middle of an undefeated season. He cancels games and forfeits, and he moves the whole team into the library with tutors. The community is furious and the parents show up to the board meeting demanding he be fired, but Carter does not move off of his behavior expectations. He tells them he is more worried about what happens to these young men in ten years than what happens on Friday night, and that moment is really where you see transformative leadership take shape.
        - paragraph [ref=e671]: The lockout looks like pure discipline from the outside, but it is actually one of the strongest culture shaping mechanisms in the whole film. By holding everyone to the same contract, including his own son Damien, Coach Carter builds accountability that comes from the group and not just from the coach (my volleyball team had a study table system like this, but different as well). The players start pushing each other to get their work done, which creates a shared identity and a shared goal that has nothing to do with the record. That is where the team chemistry really came from.
        - paragraph [ref=e672]: A powerful instance of this is when Timo Cruz, who quit early on, comes back and runs the suicides and push-ups with the other players finishing them for him, and later delivers the "our deepest fear" speech in the gym. Cruz did not return for the wins, he returned because someone held a standard for him and cared enough to keep the door open. Overall, Coach Carter emphasis that discipline and care are not opposites, and his leadership built trust, resilience, and a culture the players carried long after the season ended.
      - generic [ref=e673]:
        - heading "B" [level=3] [ref=e674]
        - paragraph [ref=e675]: "# Discipline and Care at Richmond High: A Reflection on *Coach Carter*"
        - paragraph [ref=e676]: Richmond High inherits a basketball program with a losing record, a fifty percent graduation rate, and a community that has decided both numbers are simply what Richmond is. Ken Carter takes the job under that pressure, and every decision he makes afterward reads as an answer to it.
        - paragraph [ref=e677]: Carter's first act is a contract â€” 2.3 GPA, attendance, a shirt and tie on game day â€” which functions as a culture shaping mechanism before a single practice is run. One example is the padlock on the gym doors after Carter reviews the progress reports and finds players failing terms they had signed for. He chains the gym while the team is undefeated (forfeiting games the school has not been able to win in years), and he moves the whole roster into the library. The gesture cost him wins, sponsorship goodwill, and nearly his job, but it established accountability, standards, and trust in a program that had none of the three.
        - paragraph [ref=e678]: The lockout is where discipline and care stop looking like opposites. Carter is going to withhold something a player wants in order to give him something he needs, where the surrounding adults are going to hand him the short-term win. For instance, when the school board votes to reopen the gym, Carter finds his players already inside â€” seated at desks with their books, led by Junior Battle (center) and Jason Lyle (guard) â€” studying. This proves the success of Carter's transformation, which was originally met with open resistance from parents and from Principal Garrison herself.
        - paragraph [ref=e679]: "The conflict between Carter's harshness and the community's protectiveness was never resolved in anyone's favor, and that variance was productive: the pushback forced Carter to articulate his purpose rather than merely enforce it, and the program came out with clearer legitimacy than compliance alone would have produced."
        - paragraph [ref=e680]: Timo Cruz's arc shows the same mechanism from the inside. Cruz quits, returns, and cannot complete the suicides alone until his teammates take his push-ups for him, telling Carter that "you can't do it alone." By the season's end, the team's resilience was no longer coming from Carter's whistle but from a shared identity the players enforced on each other. Motivation, cohesion, and self-accountability had become properties of the group rather than instructions from its leader.
        - paragraph [ref=e681]: "---"
