        - paragraph [ref=e93]: The lease ends Saturday at noon and the truck has to be back by four, which means the whole weekend is really a six-hour window with a penalty attached. Everything I've planned this week has been shaped by that clock.
        - paragraph [ref=e94]: So here's the plan, written down so I stop rehearsing it in bed. Kitchen and closet get boxed tomorrow after work â€” those are the ones that always look small and aren't. Books are already done. Dan (my brother, and the only one of us who has driven a sixteen-footer) takes the truck at seven; Priya brings the dolly and the moving blankets she swears she'll want back. Everyone else shows at eight-thirty, when there's something obvious to carry.
        - paragraph [ref=e95]: "The part I keep worrying at is the couch. Last time we moved it, in the old place on Third, we spent forty minutes in a stairwell with three people giving three different sets of instructions, and by the end nobody wanted to speak to anybody. For instance: I remember Dan saying \"pivot\" in a voice I'd never heard from him. This time it goes out first, before anyone is tired and before the hallway fills with boxes, and one person calls the turns. Small decision, but it buys patience, and patience is the only thing on Saturday I can't rent."
