        - paragraph [ref=e785]: Right now I am on a mission to rank every fall drink at the coffee shops near campus and I think I have a clear top three. The brown sugar oat shaken espresso from Starbucks is number one, but I always ask for two pumps instead of four because otherwise it tastes like syrup and I feel a little sick after. Second is the maple latte from Coupa Cafe, which I got with oat milk and it was so smooth and not too sweet. Third is the pumpkin cold brew, although honestly the cold foam is the only reason it is on the list. Actually, I take that back, the chai from Philz should be second because they let you build it however you want and I get it half sweet with cinnamon on top. My roommate Kenzie says I am overthinking this and she just orders a vanilla latte every single time, which is fine but she is missing out. We went to Blue Bottle at the Stanford mall on Saturday after we finished lifting and I tried their pumpkin bread too, it is pretty good but I think I prefer the banana bread I make at home with chia seeds and cinnamon. I bought a new reusable cup, it is the 24 oz Owala and it keeps ice frozen for like eight hours which is amazing for practice days. I lost my old one at the gym and I am so upset, it had all my stickers on it. Tomorrow morning I am doing yogurt with granola and frozen blueberries before our 7am session and then I will probably get an iced matcha with oat milk after, no sweetener. I do love matcha the most out of everything, especially the ceremonial grade one from the little place on California Ave. The taste is so clean and it does not make me crash at 2pm like coffee does. Nothing beats that.
