        - paragraph [ref=e955]: I finally need to replace my running shoes since the last pair is completely flat in the heel and my shins have been aching after every long run. I went to the Fleet Feet by the mall on Saturday and they put me on the treadmill to watch my gait, which was kind of embarrassing but also really helpful. The guy said I overpronate a little, so he brought out three options and I tried all of them. I really wanted to love the Hoka Clifton because my old Hokas were my favorite pair ever, but honestly the Brooks Ghost felt better in the arch and I did two laps around the store to be sure. I take that back, the Ghost felt better but the Clifton felt lighter, so I am still going back and forth. The colors matter to me more than they should. The Brooks only had them in a gray and neon yellow, which is not my favorite, but the Hoka came in this sage green that I really liked. My teammate Hattie swears by Sauconys and told me I should at least try the Endorphin Speed, so I might go back this week and put those on too before I decide anything. I did not buy anything yet, which I feel good about since I usually just pick the first thing and regret it. We have preseason conditioning starting in three weeks so I want them broken in before then, because running on new shoes during timed miles is the worst. I also got a pack of the thicker Balega socks while I was there, they were 3 for 20 dollars. Afterward I got an iced matcha at the Starbucks in the same plaza and sat in the parking lot looking at reviews on my phone for probably 20 minutes. Everyone online says the Ghost is the safest choice for someone with my mileage. I think I am going to go with the Hoka anyway. Nothing beats that first run in a brand new pair of shoes.
