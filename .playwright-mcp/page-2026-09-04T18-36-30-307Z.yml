    - generic [ref=e635]:
      - generic [ref=e636]:
        - heading "A" [level=3] [ref=e637]
        - paragraph [ref=e638]: "# When the Leader Is the Bottleneck: Joy's Control Room in *Inside Out*"
        - paragraph [ref=e639]: Riley's headquarters staff is thrown into crisis the moment the family relocates from Minnesota to San Francisco, and the console team has no procedure for a disruption of that size. Every leadership failure that follows traces back to how Joy manages the group under that pressure rather than to the move itself.
        - paragraph [ref=e640]: One example is the chalk circle. Joy draws a ring on the floor and instructs Sadness to stay inside it, telling her the job is to make sure "all the sadness stays in." This is a manager solving a performance problem by isolating the underperformer instead of clarifying what the role is actually for, and it produces textbook role ambiguity for Sadness, who genuinely does not know what she contributes. Joy's optimism reads as vision, but here it functions as suppression of dissent, and the cost is a direct hit to trust, psychological safety, and the team's willingness to surface bad news.
        - paragraph [ref=e641]: Sadness is going to lead in a different manner than Joy, and the contrast is the whole argument of the film. For instance, when Bing Bong, Riley's discarded imaginary friend, loses his wagon (and with it the only thing he has left of the childhood he was built for), Joy attempts to redirect him with jokes and energy. Nothing moves. Sadness sits down beside him, names the loss, and lets him cry â€” and he stands up and walks. Joy motivates by overriding; Sadness motivates by acknowledging. The result is accountability, engagement, and a follower who can actually move again.
        - paragraph [ref=e642]: The organization's real test comes when the core memories are lost and Riley boards the bus to run away, with Anger, Fear, and Disgust improvising at a console that has gone dark. What holds the team together at that point is not Joy's talent and not luck. It is the shared identity the group had built across years of running Riley together â€” a culture strong enough that the remaining staff keep working a broken board rather than abandoning it. Resilience, morale, and cohesion came from that shared culture, not from the leader on the org chart.
        - paragraph [ref=e643]: Joy's eventual decision to hand Sadness the console is a culture shaping mechanism, and it proves that variance in leadership style is an asset rather than a liability for an organization. The friction between the two was never waste; it was the mechanism that produced adaptability, maturity, and durable trust.
