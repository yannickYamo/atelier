    - generic [ref=e294]: Trial 12 of 51
    - generic [ref=e296]:
      - generic [ref=e297]:
        - heading "A" [level=3] [ref=e298]
        - paragraph [ref=e299]: "**Reflection: Zootopia and the Difference Between Authority and Mandate**"
        - paragraph [ref=e300]: "The Zootopia Police Department enters the film under heavy external pressure: fourteen missing mammal cases sit unsolved while City Hall and the press watch, and a political initiative has placed an officer in the precinct that the precinct never requested. Every leadership decision in the story is a response to that pressure rather than a free choice."
        - paragraph [ref=e301]: Chief Bogo begins with formal authority and no mandate for his newest hire. One example is the first roll call, where he distributes the missing mammal cases to his veteran officers and assigns Judy Hopps to parking duty, telling the room he should introduce the new recruits but is "not going to, because I don't care." The scene illustrates role conflict cleanly â€” Bogo is accountable upward to Mayor Lionheart and the Mammal Inclusion Initiative, and accountable downward to a squad whose norms he cannot afford to violate. He resolves it by giving Judy the title without the work. Legitimacy, credibility, and trust do not transfer with a badge.
        - paragraph [ref=e302]: Judy is going to lead in a different manner and build a mandate from below where Bogo withholds one from above. She writes two hundred tickets before noon (a self-imposed stretch goal nobody set for her), then leverages the Otterton case into a forty-eight-hour ultimatum in front of Assistant Mayor Bellwether, staking her job on a result. Her informal coalition with Nick Wilde, a hustler with no positional power at all, supplies the network access the department itself lacks. Influence earned through demonstrated competence outperforms influence granted by policy.
        - paragraph [ref=e303]: The friction between the two is not wasted. Bogo's gatekeeping forces Judy to generate evidence rather than goodwill, and Judy's insubordination forces Bogo to test whether his intake standards were selection criteria or simply habit. Having genuine variance in leadership styles inside one command structure produced accountability that neither figure would have produced alone.
        - paragraph [ref=e304]: By the closing scenes Bogo has revised the culture rather than merely the roster, welcoming Nick to the force and treating Judy's judgment as an operating asset. What held the department together through the press-conference crisis was not any single officer's talent but a reconstituted shared identity â€” an agreed sense of who counts as one of us. Culture shaping mechanisms, not headcount, are what convert a diversity mandate into resilience, morale, and durable institutional trust.
        - paragraph [ref=e305]: "*(Applied: opened on external pressure; ran Bogo/Judy as a contrast pair; anchored each paragraph in a named scene; closed paragraphs on abstract verdicts.)*"
