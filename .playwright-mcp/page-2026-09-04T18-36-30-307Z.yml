        - paragraph [ref=e1293]: Rain all night and it hadn't quit by six, and I'd already told three people I was doing this, which is the only reason I laced up. Forty-one degrees, wind off the reservoir, and a plan that assumed none of that.
        - paragraph [ref=e1294]: It fell apart at mile four. The left shoe had been damp since the driveway, and by the bridge I could feel the seam working at my heel like a thumbnail. There's a version of me who stops there, walks home, calls it weather. There's another one who decides that stopping is a character flaw. The second one won, which is how I ended up eleven miles from my car with a blister the size of a quarter and no way to make it smaller.
        - paragraph [ref=e1295]: The turnaround is where it really went. The fountain at the trailhead was capped for the season (I'd carried one small bottle, already empty, because I'd planned around that fountain). I stand there for a full minute pressing the handle like the problem is my technique. Then I turn around and start the long part with nothing.
        - paragraph [ref=e1296]: Mile fourteen I quit running and didn't announce it to myself â€” it just stopped happening. The phone died somewhere in there, so no music, no pace, no one to text. What got me back wasn't fitness and it wasn't grit, whatever that is. It was that the trail only goes one direction and I knew the sound of the road crossing near the parking lot. Familiarity did the work that discipline was supposed to do.
        - paragraph [ref=e1297]: Home at eleven. Sixteen point something, not eighteen. Shoe off in the garage because I didn't want to see it on the good floor.
        - paragraph [ref=e1298]: The strange part is I'm not upset about it. Every good run this year has been a run where I executed the plan, which means I've been practicing the plan and not the running. Today I practiced the other thing â€” the part where the plan is gone by mile four and you finish anyway, slowly, badly, on foot. I'd rather have that in the bank than another clean eighteen.
