    - generic [ref=e182]: Trial 8 of 51
    - generic [ref=e184]:
      - generic [ref=e185]:
        - heading "A" [level=3] [ref=e186]
        - paragraph [ref=e187]: "## Reflection: The Costs of Advocacy Leadership in *The Blind Side*"
        - paragraph [ref=e188]: Leigh Anne Tuohy is often read as an inspirational figure, but the more useful leadership question is not what she accomplishes â€” it's what she spends. Advocacy leadership is rarely free, and the film is unusually clear about the invoice.
        - paragraph [ref=e189]: "**Social capital and idiosyncrasy credit.** Hollander's idea of idiosyncrasy credit holds that leaders accumulate latitude to deviate by first conforming and delivering value. Leigh Anne enters the story with substantial credit: wealth, an Ole Miss pedigree, a secure position in Memphis society. Her advocacy is an expenditure of that balance. The luncheon scene is the transaction made visible â€” she trades in-group standing for a moral position, and her peers price it accordingly. Referent power built inside a reference group weakens the moment you use it against that group's norms."
        - paragraph [ref=e190]: "**Legitimacy and motive scrutiny.** The NCAA investigation dramatizes a predictable cost: advocates get their intentions audited in ways bystanders never do. Suchman's work on organizational legitimacy is relevant here â€” sponsorship of an outsider invites questions about whether the sponsor benefits. Leigh Anne cannot prove her motives, only endure the inquiry. Leaders who champion individuals across status lines should expect this and build a record that can survive it."
        - paragraph [ref=e191]: "**Role conflict and emotional labor.** Katz and Kahn's role theory maps her strain neatly: mother, wife, business owner, booster, and now advocate, with incompatible demands and no additional hours. Collins absorbs secondary costs at school; the family system reorganizes around the intervention. Emotional labor is likewise unpriced â€” the vigilance, the confrontation in Hurt Village, the constant translation between two worlds she only partly understands. Boundary-spanning roles are chronically stressful precisely because the spanner belongs fully to neither side."
        - paragraph [ref=e192]: "**The cost she doesn't pay â€” and should.** Greenleaf's servant-leadership test asks whether those served grow more autonomous. The film's weakest moment is Leigh Anne speaking *for* Michael rather than creating conditions for him to speak. Advocacy that substitutes the leader's voice for the stakeholder's produces dependency, not development. There is also a systems cost: single-loop learning solves one case brilliantly while leaving the generating structures untouched. Rescue is not reform."
        - paragraph [ref=e193]: "**Takeaway.** Advocacy leadership converts accumulated status into someone else's opportunity â€” a real and depleting transaction. The discipline is to spend deliberately, expect the legitimacy audit, protect the people your role strain touches, and keep asking whether you are building voice or replacing it."
      - generic [ref=e194]:
        - heading "B" [level=3] [ref=e195]
        - paragraph [ref=e196]: "**The Blind Side: The Cost of Advocacy Leadership**"
        - paragraph [ref=e197]: The Tuohy household absorbs immediate external pressure the moment Leigh Anne brings Michael Oher through the door, and the pressure is social, financial, and reputational at once. A Memphis social circle, a private Christian school board, and eventually the NCAA all apply scrutiny to a decision made in a single night, and the film is useful as organizational data precisely because it shows what advocacy costs the advocate.
        - paragraph [ref=e198]: "One example is the country club lunch with her friends (Sherri and Beth, longtime members of her social network), who question her motives until Leigh Anne cuts them off with the line that Michael is \"changing mine.\" The moment illustrates role conflict: she is simultaneously a socialite dependent on that network for business referrals, a mother of two, and a sponsor to a young man with no legal claim on her. She pays for the advocacy by spending relational capital she cannot easily rebuild, and she pays visibly, in front of the people who grant her standing. The cost here is legitimacy, belonging, and the quiet comfort of being unquestioned."
        - paragraph [ref=e199]: For instance, on the practice field, Leigh Anne walks past Coach Cotton, stops the drill, and tells Michael that "this team is your family." Cotton is going to lead through schemes, repetition, and positional instruction; Leigh Anne is going to lead by reframing the purpose of the work until protection instinct does what coaching alone cannot. The variance between them is not a turf problem but a culture shaping mechanism, and the friction between a head coach's authority and an outsider's intervention produced a functioning offensive line (and a season the program could not otherwise have had). Divided authority, handled this way, generated clarity, buy-in, and accountability.
        - paragraph [ref=e200]: One example of the sharpest cost is the NCAA interview with investigator Jocelyn Granger, who asks whether Leigh Anne recruited Michael for Ole Miss. The question lands because it is partly fair, and Leigh Anne loses something real (certainty about her own motives, and Michael's trust for a stretch of days). Yet the relationship held. The family's resilience was never dependent on Leigh Anne's decisiveness; it came from a shared identity built over years of ordinary meals, and that identity is what transformative leadership actually leaves behind â€” trust, durability, and mutual accountability.
        - paragraph [ref=e201]: "---"
        - paragraph [ref=e202]: "*Optional moves used:* minor characters named by role in apposition (Sherri and Beth, Coach Cotton, Jocelyn Granger); future-tense-of-habit for the Cotton/Tuohy contrast."
