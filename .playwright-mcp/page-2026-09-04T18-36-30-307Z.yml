  - article [ref=e924]:
    - generic [ref=e925]: Trial 36 of 51
    - generic [ref=e927]:
      - generic [ref=e928]:
        - heading "A" [level=3] [ref=e929]
        - paragraph [ref=e930]: "The Ford Motor Company enters the 1966 season under enormous external pressure: a failed acquisition of Ferrari has left Henry Ford II publicly humiliated, and he orders a Le Mans win on a timeline the engineering organization has never come close to meeting. Carroll Shelby is handed that mandate and almost immediately discovers that the pressure does not stop at his desk â€” it lands on the one driver who can actually deliver it."
        - paragraph [ref=e931]: "Shelby's position illustrates a textbook case of role conflict. He is simultaneously the vendor accountable to Ford's executives and the leader accountable to his own shop. One example is when Leo Beebe (senior vice president of marketing) has Ken Miles removed from the Le Mans roster for being a brand risk, and Shelby has to walk out and tell his own driver the news himself. Rather than absorb the loss quietly, Shelby escalates: he takes Ford II out in the GT40 (a ride that leaves the CEO weeping in the passenger seat) and stakes his entire company on Miles driving. That willingness to place personal capital behind a subordinate is what converts positional authority into genuine trust, credibility, and follower commitment."
        - paragraph [ref=e932]: The film is built on a contrast in leadership style. Beebe is going to lead through control, image management, and hierarchy, while Shelby is going to lead by protecting the technical expert from the hierarchy. For instance, when Shelby locks Miles inside the office and takes the key so he can argue with the Ford executives uninterrupted, he is doing culture shaping work â€” deciding who in the organization gets to be difficult and what the shop will tolerate in exchange for performance. The friction between the two approaches is not purely destructive; the executive pressure imposed discipline and deadlines that the racing side would never have set for itself, and the combination produced accountability, urgency, and an unusually resilient team.
        - paragraph [ref=e933]: The final test comes at Le Mans, when Beebe orders the three cars to cross the line together and Miles surrenders a win he has already earned. He complies. What holds in that moment is not the reporting structure but the shared identity built inside the shop, where Miles, Shelby, and Phil Remington (the chief mechanic) had spent a year solving problems nobody above them understood. The team's resilience had stopped depending on Shelby's instructions and started coming from mutual respect, loyalty, and a common sense of purpose.
        - paragraph [ref=e934]: "---"
        - paragraph [ref=e935]: "Reading it back: I leaned on the optional habit of naming minor figures in apposition (Beebe, Remington) and used the future-tense-of-habit construction for the Beebe/Shelby contrast pair."
      - generic [ref=e936]:
        - heading "B" [level=3] [ref=e937]
        - paragraph [ref=e938]: Role Conflict, Trust, & Advocacy
        - paragraph [ref=e939]: In the movie Ford v Ferrari, Carroll Shelby is placed in one of the hardest positions a leader can be in, since he is answering to the Ford executives above him while also protecting the driver below him. Shelby is a former racer turned car builder, so he understands both worlds, and that is exactly what makes him valuable and exhausted at the same time. Ken Miles is brilliant, honest, and completely uninterested in company politics, while Leo Beebe cares about the brand image and what looks right for Ford. Shelby stands in the middle of those two very different sets of expectations.
        - paragraph [ref=e940]: One example specifically is when Shelby locks Beebe out of the office and drives Henry Ford II around the track in the GT40. It is a wild move, but he is doing it to buy Miles a seat in the car, and he wins the argument by giving Ford an experience instead of a report. This shows a leader who is willing to spend his own political capital for his people, and it emphasis that advocacy is a real leadership behavior, not just a nice idea. Miles never has to ask for it, he simply learns that someone above him is fighting for him.
        - paragraph [ref=e941]: The role conflict Shelby carries creates real stress and something close to burnout, and you see it in the scene where he tells Miles he has to let him go and Miles throws a wrench at him. Even in that moment there is mutual respect, because the two of them trust each other's judgement about the car more than they trust anybody in a suit. That trust becomes the team's culture, the crew at Shelby American works absurd hours and stays engaged because the shared goal is clear and the standard is honest (my volleyball team had a coach like this, demanding but always in your corner).
        - paragraph [ref=e942]: The biggest test comes at Le Mans, when Shelby has to pass along the order to slow down for the photo finish and simply tells Miles, "It's your call." He does not pretend the decision is fair, and he does not hide behind the company. Miles gives up the win anyway, which says everything about the accountability and loyalty that had been built. Overall, Shelby's leadership shows that trust, advocacy, and honesty with your people will carry a team through the moments where the organization itself lets them down.
