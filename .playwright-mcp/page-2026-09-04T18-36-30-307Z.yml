        - paragraph [ref=e17]: I am trying to figure out the budget for our ski trip in January and it is stressing me out a little bit. We are going to Tahoe for four days and there are six of us splitting an Airbnb, which comes out to about $140 each for the whole stay, so that part is not bad at all. Lift tickets are the killer. Palisades is $189 a day if you buy it at the window, so I am buying the Ikon Base pass instead since I already know I am going at least two other weekends this winter. My roommate Sydney says the Epic pass is better value and she might be right, but all of my friends ski Palisades and Alpine so I am staying with Ikon. I already have my skis from high school and my helmet, but I need to rent boots because mine are destroyed. I am going to try the shop in Truckee instead of the on-mountain rental since it is almost half the price. For food we are all putting $60 into a Venmo pool and doing groceries at the Safeway on the way in, and then we will do one nice dinner out, probably Moody's. I am also budgeting like $40 for gas since I am driving and we are splitting it four ways in my car. Right now I have $520 saved from my job at the front desk and I think I can get to $700 by the end of December if I stop getting Starbucks every single morning. That is the hard part honestly. I have been making coffee in my room with the little frother and it is pretty good, but I still prefer the oat milk latte from the campus location. Actually I take that back, I prefer the matcha there, they do not oversweeten it if you ask. Anyway I think the trip will be worth every dollar because last year the snow was perfect and we skied bell to bell all four days. Nothing beats that.
