        - paragraph [ref=e1083]: I decided this week I was going to try a whole new morning routine and honestly it did not go the way I planned. I set my alarm for 5:15 which is an hour earlier than normal, and the idea was to do a cold shower, journal for ten minutes, and eat before lifting instead of after. The cold shower part was fine, I actually liked it for about forty seconds and then I did not like it at all. The real problem was breakfast. I swapped my normal Dannon Oikos Greek yogurt with chia seeds and berries for a big smoothie with two scoops of protein, peanut butter, banana and oat milk, and I drank the entire thing twenty minutes before lifting. I felt so sick during squats, I had to sit down twice and my teammate Hattie kept asking if I was okay. Hattie is our assistant coach now since she graduated, so it was extra embarrassing. By 9am I was starving again anyway which makes no sense. Then I was so tired from waking up early that I fell asleep during my 2pm class, which I have never done. So the experiment gave me a stomachache and a nap, not exactly the glow up I was going for. Tomorrow I am going back to yogurt first, lift second, and my alarm at 6:15 like a normal person. I might keep the cold shower though, just a shorter one. I also grabbed a Starbucks after class which I usually skip, and I got the iced brown sugar shaken espresso with no extra syrup because it is way too sweet otherwise. Actually I take that back, I really wanted a matcha but they were out. Nothing beats a matcha with oat milk in the morning, that is the routine I should have kept.
